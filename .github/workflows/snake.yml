name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aklnaaw
          outputs: snake.svg
      - name: Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add snake.svg
          git diff --staged --quiet || (git commit -m "chore: update snake" && git push)
